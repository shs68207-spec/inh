.scr{position:absolute;left:0;right:0;top:0;bottom:0;padding:var(--top) 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;text-align:center;overflow-y:auto;transition:opacity .9s ease,transform .9s ease}
#intro.gone{opacity:0;transform:scale(1.03);pointer-events:none}
#card{opacity:0;transform:translateY(14px);pointer-events:none;color:var(--gold2)}
#card.show{opacity:1;transform:none;pointer-events:auto;transition-delay:.35s}
h1{font-family:'Playfair Display',serif;font-weight:400;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(16px,5vw,24px);margin:0 0 12px;color:var(--gold2);text-shadow:0 1px 4px rgba(90,30,10,.35)}
.sub{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(17px,5vw,23px);margin:0 0 4svh}
.btn{font:500 16px 'Cormorant Garamond',serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);background:rgba(150,66,42,.25);border:1.5px solid var(--gold);padding:17px 28px;cursor:pointer}
